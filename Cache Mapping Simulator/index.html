<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cache Mapping Simulator – Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#020617,#0f172a);color:#e5e7eb;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .wrap{max-width:900px;text-align:center;padding:20px}
    h1{margin-bottom:16px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card{background:#020617;border:1px solid rgba(56,189,248,.25);border-radius:16px;
      padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .card h2{color:#38bdf8;margin-top:0}
    .card p{color:#94a3b8}
    .card a{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:10px;
      text-decoration:none;font-weight:700;color:#020617;
      background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧠 Cache Mapping Simulator (COA)</h1>
    <p>Select a mapping technique to visualize step-by-step.</p>
    <div class="cards">
      <div class="card">
        <h2>Direct Mapping</h2>
        <p>Address % Cache Size. Fast, but more conflict misses.</p>
        <a href="direct.html">Open</a>
      </div>
      <div class="card">
        <h2>Fully Associative</h2>
        <p>Any block can go anywhere. Best hit ratio.</p>
        <a href="fully.html">Open</a>
      </div>
      <div class="card">
        <h2>Set-Associative</h2>
        <p>Balanced approach used in real CPUs.</p>
        <a href="set.html">Open</a>
      </div>
    </div>
  </div>
</body>
</html>
